<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>VoxClarity</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0e1116;--card:#171b23;--line:#262c38;--tx:#e8ecf3;--mut:#8b94a7;--ac:#7c8cff;--ac2:#37d4c4;--bad:#ff6b6b;--ok:#4ade80}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 "Segoe UI",system-ui,sans-serif;overflow-x:hidden}
body{display:flex;flex-direction:column;min-width:0}
header{display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--line)}
header img{width:30px;height:30px}
header h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.2px}
#lang{margin-left:auto;width:auto;padding:3px 8px;font-size:12px;border-radius:99px}
.ver{color:var(--mut);font-size:12px;padding:3px 9px;border:1px solid var(--line);border-radius:99px}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;padding:18px 22px;align-items:start}
main>.col:last-child{overflow-y:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
#drop{display:flex;align-items:center;gap:12px;border:2px dashed #38405a;border-radius:14px;padding:22px 16px;cursor:pointer;transition:.15s;min-width:0}
#drop:hover,#drop.over{border-color:var(--ac);background:#1a2030}
#drop svg{flex:none;width:30px;height:30px;stroke:var(--ac)}
#fname{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
label{display:block;color:var(--mut);font-size:12px;margin:0 0 5px}
select{width:100%;background:#0f131a;color:var(--tx);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit}
.row3{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sl{display:grid;grid-template-columns:96px minmax(0,1fr) 34px;align-items:center;gap:10px;margin:9px 0}
.sl span{color:var(--tx)}
.sl output{color:var(--mut);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--ac)}
.btns{display:flex;flex-wrap:wrap;gap:10px}
button{font:inherit;color:var(--tx);background:#222838;border:1px solid var(--line);border-radius:10px;padding:9px 15px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
button:hover:not(:disabled){border-color:var(--ac)}
button:disabled{opacity:.4;cursor:default}
button.main{background:linear-gradient(135deg,#6a7bff,#37b6d4);border:0;color:#08101a;font-weight:600}
button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ab{display:flex;gap:8px;margin:12px 0}
.ab button{flex:1;justify-content:center}
.ab button.on{background:var(--ac);border-color:var(--ac);color:#0a0d18;font-weight:600}
audio{display:none}
#seek{width:100%}
.hint{color:var(--mut);font-size:12px;text-align:center}
footer{border-top:1px solid var(--line);padding:10px 22px 12px}
#bar{height:4px;background:#222838;border-radius:4px;overflow:hidden;margin-bottom:8px}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .3s}
#status{font-size:13px;min-height:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#status.err{color:var(--bad)}#status.ok{color:var(--ok)}
.hide{display:none!important}
.rec{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
#bRec.on{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:600}
#recT{color:var(--mut);font-size:12px;font-variant-numeric:tabular-nums}
#lvl{height:4px;background:#222838;border-radius:4px;overflow:hidden;margin-top:8px}
#lvl i{display:block;height:100%;width:0;background:var(--ok);transition:width .08s}
.list{margin-top:10px;max-height:150px;overflow-y:auto;border:1px solid var(--line);border-radius:10px}
.list .it{display:flex;gap:10px;align-items:center;padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--line);min-width:0}
.list .it:last-child{border-bottom:0}
.list .it:hover{background:#1a2030}
.list .it.sel{background:#232b45;box-shadow:inset 3px 0 0 var(--ac)}
.list .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .tm{flex:none;color:var(--mut);font-size:12px}
.list .empty{padding:10px;color:var(--mut);font-size:12px;text-align:center}
.list input[type=checkbox]{flex:none;accent-color:var(--ac);margin:0;width:15px;height:15px}
.allrow{display:flex;justify-content:space-between;align-items:center;margin-top:10px;min-width:0}
.allrow label{margin:0}
.allrow button{padding:3px 10px;font-size:12px}
.allrow+.list{margin-top:6px}
#drop{padding:14px 16px}
#playing{color:var(--tx)}
.set{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:8px;align-items:center;margin-bottom:10px}
.set button{padding:7px 11px}
.setname{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;margin-bottom:10px}
input[type=text]{width:100%;background:#0f131a;color:var(--tx);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit}
button.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.folder{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;margin-bottom:10px}
.folder span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mut);font-size:12px;min-width:0}
.folder button{padding:6px 11px;font-size:12px}
.outbtns{margin-top:10px}
.outbtns button{padding:6px 12px;font-size:12px}
.ibtn{padding:4px 11px;font-size:12px;border-radius:99px}
.modal{position:fixed;inset:0;background:rgba(5,7,10,.72);display:flex;align-items:center;justify-content:center;z-index:10;padding:18px}
.modal .card{max-width:640px;width:100%;max-height:100%;overflow-y:auto;background:#171b23}
.modal h2{font-size:16px;margin:0 0 4px}.modal h3{font-size:13px;margin:16px 0 6px;color:var(--mut);font-weight:600}
.modal p{margin:6px 0;color:var(--tx)}.modal a{color:var(--ac2)}
.modal ul{margin:0;padding-left:18px}.modal li{margin:4px 0;overflow-wrap:anywhere}
.modal .small{color:var(--mut);font-size:12px}
#upMsg{min-height:18px;margin-top:8px;font-size:13px;overflow-wrap:anywhere}
</style>
</head>
<body>
<header>
  <img src="icon.svg" alt=""><h1>VoxClarity</h1>
  <select id="lang" data-t="langTip"><option value="it">IT</option><option value="en">EN</option></select>
  <span class="ver" id="ver">v-</span>
  <button id="bAbout" class="ibtn" data-t="aboutTip"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg><span data-i="about"></span></button>
</header>
<main>
  <div class="col">
    <div class="card">
      <label data-i="s1">1. Ingresso</label>
      <div id="drop" data-t="dropTip">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
        <div style="min-width:0"><div id="fname" data-i="dropText"></div></div>
      </div>
      <div class="rec" style="margin-top:10px">
        <select id="mic"><option value="" data-i="micDefault"></option></select>
        <button id="bRec"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span id="recL"></span></button>
      </div>
      <div id="lvl"><i id="lvlf"></i></div>
      <div id="recT"></div>
      <div class="allrow"><label id="selCount"></label><button id="bAll" data-t="allTip"></button></div>
      <div class="list" id="inList"></div>
    </div>
    <div class="card">
      <div class="allrow" style="margin-top:0;margin-bottom:5px"><label data-i="s2"></label><button id="bReset" data-i="reset" data-t="resetTip"></button></div>
      <div class="set">
        <select id="setSel"><option value="" data-i="setDefault"></option></select>
        <button id="bLoad" data-i="load" data-t="loadTip"></button>
        <button id="bSave" data-i="save" data-t="saveTip"></button>
        <button id="bDel" data-t="delSetTip"></button>
      </div>
      <div class="setname hide" id="saveRow">
        <input type="text" id="setName" maxlength="40" data-p="setNamePh">
        <button id="bSaveOk" class="main" data-i="save"></button><button id="bSaveNo" data-i="cancel"></button>
      </div>
      <div class="row3">
        <div><label data-i="sound"></label><select id="preset"></select></div>
        <div><label data-i="volume" data-t="volumeTip"></label><select id="target"></select></div>
      </div>
      <div style="margin-top:8px" id="sliders"></div>
    </div>
    <div class="btns">
      <button class="main" id="bRun" disabled><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg><span id="runL"></span></button>
      <button id="bStop" class="hide" data-i="stop" data-t="stopTip"></button>
    </div>
  </div>
  <div class="col">
    <div class="card">
      <label id="outTitle"></label>
      <div class="folder"><span id="outDir"></span><button id="bPickDir" data-i="changeFolder" data-t="changeFolderTip"></button></div>
      <div class="list" id="outList" style="margin-top:0"></div>
      <div class="btns outbtns"><button id="bODel" disabled></button></div>
    </div>
    <div class="card">
      <label><span data-i="listen"></span> <span id="playing"></span></label>
      <div class="ab"><button id="aO" disabled data-i="orig"></button><button id="aS" disabled data-i="studio"></button></div>
      <input type="range" id="seek" min="0" max="1000" value="0" disabled>
      <div class="btns" style="margin-top:12px"><button id="bPlay" disabled><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><span id="playL"></span></button></div>
      <div class="hint" style="margin-top:10px" data-i="spaceHint"></div>
      <audio id="aud0"></audio><audio id="aud1"></audio>
    </div>
    <div class="btns">
      <button id="bFolder" class="hide"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span data-i="openFolder"></span></button>
      <button id="bLog"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM9 12h7M9 16h7"/></svg><span data-i="log"></span></button>
    </div>
  </div>
</main>
<div class="modal hide" id="aboutBox"><div class="card">
  <h2>VoxClarity <span id="abVer"></span></h2>
  <p class="small" data-i="abTag"></p>
  <p><span data-i="abLicense"></span></p>
  <p><span data-i="abRepo"></span> <a id="abRepoLink" target="_blank" rel="noopener"></a></p>
  <h3 data-i="abThird"></h3>
  <ul id="abList"></ul>
  <p class="small" data-i="abAttr"></p>
  <p class="small" data-i="abPrivacy"></p>
  <div class="btns" style="margin-top:14px">
    <button id="bUpd" data-i="abCheck"></button>
    <button id="bReport" data-i="abReport"></button>
    <button id="bAbClose" class="main" data-i="abClose"></button>
  </div>
  <div id="upMsg"></div>
</div></div>
<footer><div id="bar"><i id="barfill"></i></div><div id="status"></div></footer>

$("bAbout").onclick=()=>{fillAbout();$("upMsg").textContent="";$("aboutBox").classList.remove("hide")};
$("bAbClose").onclick=()=>$("aboutBox").classList.add("hide");
$("aboutBox").onclick=e=>{if(e.target==$("aboutBox"))$("aboutBox").classList.add("hide")};
document.addEventListener("keydown",e=>{if(e.key=="Escape")$("aboutBox").classList.add("hide")});
$("bUpd").onclick=async()=>{const m=$("upMsg");m.textContent=t("upChecking");m.style.color="";
  try{const r=await (await fetch("/api/update-check")).json();
    const cur=$("ver").textContent.replace(/^v/,"");
    if(r.state=="newer"){m.innerHTML=esc(t("upNewer",{v:r.latest}))+` <a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.url)}</a>`;m.style.color="var(--ok)"}
    else if(r.state=="current")m.textContent=t("upCurrent",{v:cur});
    else if(r.state=="none")m.textContent=t("upNone");
    else if(r.state=="offline")m.textContent=t("upOffline");
    else m.textContent=t("upError",{d:r.detail||"?"})}
  catch(e){m.textContent=t("upError",{d:e.message})}};
$("bReport").onclick=async()=>{try{const r=await post("/api/report");$("upMsg").style.color="";$("upMsg").textContent=t("reportDone",{d:r.logdir})}catch(e){$("upMsg").textContent=t("error",{err:e.message})}};
// Fit the window height to the content (header + main + footer); width is kept.
let fitT=null;
// The window ends just below the Process button (+ footer); the right column scrolls inside that height.
function fitWindow(){const left=document.querySelector("main>.col"),right=document.querySelector("main>.col:last-child");
  right.style.maxHeight=left.offsetHeight+"px";
  const bottom=$("bRun").getBoundingClientRect().bottom+window.scrollY+18,
    h=Math.ceil(bottom+document.querySelector("footer").offsetHeight)+(outerHeight-innerHeight),H=Math.min(h,screen.availHeight);
  if(Math.abs(H-outerHeight)>2){resizeTo(outerWidth,H);
    setTimeout(()=>post("/api/clientlog",{msg:"fit window: wanted "+H+" got "+outerHeight}),300)}
  if(Math.abs(H-(window._savedH||0))>2){window._savedH=H;post("/api/config",{winH:H}).catch(()=>{})}}
new ResizeObserver(()=>{clearTimeout(fitT);fitT=setTimeout(()=>{try{fitWindow()}catch(e){}},120)}).observe(document.body);
window.addEventListener("error",e=>post("/api/clientlog",{msg:t("jsError",{err:e.message})}));
init();
</script>
</body>
</html>
